<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Jump</title>
<script src="https://yandex.ru/games/sdk/v2"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#0a0a14; font-family:'Segoe UI',Arial,sans-serif; }
  #game { display:block; width:100vw; height:100vh; touch-action:none; }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; background:rgba(10,10,20,.92); color:#fff; padding:20px; z-index:10; overflow-y:auto; }
  .hidden { display:none !important; }
  h1 { font-size:clamp(32px,9vw,60px); color:#0ff; text-shadow:0 0 20px #0ff,0 0 40px #0aa; margin-bottom:8px; letter-spacing:3px; }
  h2 { font-size:clamp(20px,5vw,32px); color:#f0f; text-shadow:0 0 15px #f0f; margin-bottom:16px; }
  p { font-size:clamp(14px,3.5vw,18px); color:#aab; margin-bottom:12px; max-width:420px; line-height:1.5; }
  button { background:linear-gradient(135deg,#0ff,#f0f); border:none; color:#000; font-size:clamp(15px,4vw,18px); font-weight:bold; padding:12px 32px; border-radius:30px; cursor:pointer; margin:5px; box-shadow:0 0 20px rgba(0,255,255,.5); }
  button:active { transform:scale(.96); }
  button:disabled { opacity:.6; }
  .btn2 { background:linear-gradient(135deg,#333,#555); color:#fff; box-shadow:0 0 12px rgba(255,255,255,.2); }
  .btn-ad { background:linear-gradient(135deg,#ff0,#f80); color:#000; }
  button small { display:block; font-size:11px; font-weight:normal; opacity:.8; margin-top:2px; }
  #hud { position:absolute; top:0; left:0; right:0; padding:12px 15px; display:flex; justify-content:space-between; align-items:center; color:#fff; font-size:clamp(13px,3.2vw,17px); font-weight:bold; pointer-events:none; z-index:5; text-shadow:0 0 10px #0ff; gap:6px; flex-wrap:wrap; }
  #hud .hearts { color:#f44; }
  #hud .combo { color:#f0f; }
  #coins { color:#ff0; }
  .shop-tabs { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; justify-content:center; }
  .shop-tabs button { padding:8px 14px; font-size:13px; margin:0; }
  .shop-tabs button.active { background:linear-gradient(135deg,#f0f,#0ff); }
  .shop-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; max-width:600px; width:100%; max-height:45vh; overflow-y:auto; padding:8px; }
  .shop-item { background:#1a1a2e; border:2px solid #0ff4; border-radius:12px; padding:10px; }
  .shop-item.owned { border-color:#0f0; }
  .shop-item.selected { border-color:#f0f; box-shadow:0 0 15px #f0f; }
  .shop-item .dot { width:36px; height:36px; border-radius:50%; margin:0 auto 6px; box-shadow:0 0 12px currentColor; }
  .shop-item .preview { width:100%; height:44px; border-radius:8px; margin-bottom:6px; }
  .shop-item button { padding:7px 14px; font-size:13px; margin:4px 0 0; }
  .shop-item .desc { font-size:11px; color:#889; margin:4px 0; min-height:26px; }
  .shop-item .name { font-size:13px; margin-bottom:4px; }
  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#0a0a14; color:#0ff; font-size:22px; z-index:100; text-shadow:0 0 15px #0ff; }
  #toast { position:absolute; top:80px; left:50%; transform:translateX(-50%); background:linear-gradient(135deg,#0ff,#f0f); color:#000; padding:10px 22px; border-radius:20px; font-weight:bold; font-size:15px; z-index:50; box-shadow:0 0 25px rgba(0,255,255,.7); opacity:0; transition:opacity .3s, top .3s; pointer-events:none; white-space:nowrap; }
  #toast.show { opacity:1; top:100px; }
  #nameInput { font-size:20px; padding:12px 20px; border-radius:30px; border:2px solid #0ff; background:#1a1a2e; color:#fff; text-align:center; outline:none; box-shadow:0 0 20px rgba(0,255,255,.4); width:min(300px,80vw); margin:8px 0; }
  .ach-item { background:#1a1a2e; border:2px solid #333; border-radius:12px; padding:10px; text-align:left; }
  .ach-item.done { border-color:#0f0; }
  .ach-item .ach-name { font-size:13px; font-weight:bold; color:#fff; }
  .ach-item .ach-desc { font-size:11px; color:#889; margin-top:2px; }
  .ach-item .ach-status { font-size:11px; margin-top:4px; color:#0f0; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="loading">Загрузка...</div>
<div id="toast"></div>

<div id="hud" class="hidden">
  <div><span data-i18n="level">Уровень</span> <span id="levelNum">1</span></div>
  <div><span data-i18n="platform">Платформа</span>: <span id="scoreNum">0</span></div>
  <div><span class="combo" id="comboDisplay"></span> <span class="hearts" id="hearts"></span> <span id="coins">🪙 0</span></div>
</div>

<div id="nameScreen" class="overlay hidden">
  <h2 data-i18n="enterName">ВВЕДИТЕ НИК</h2>
  <p data-i18n="nameHint">Он будет отображаться в таблице рекордов</p>
  <input id="nameInput" type="text" maxlength="16" placeholder="Ник" />
  <button onclick="saveName()" data-i18n="save">СОХРАНИТЬ</button>
</div>

<div id="menu" class="overlay hidden">
  <h1>NEON JUMP</h1>
  <p data-i18n="menuDesc">Прыгай по платформам как можно выше!</p>
  <p style="font-size:15px;color:#ff0;"><span data-i18n="yourRecord">Твой рекорд</span>: <span id="menuRecord">0</span> <span data-i18n="platforms">платформ</span></p>
  <p style="font-size:13px;color:#0ff;"><span id="menuName"></span></p>
  <button id="playBtn" onclick="startGame()" data-i18n="play">ИГРАТЬ</button>
  <div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:center;">
    <button class="btn2" onclick="openShop()" data-i18n="shop">МАГАЗИН</button>
    <button class="btn2" onclick="openLeaderboard()" data-i18n="leaders">ЛИДЕРЫ</button>
    <button class="btn2" onclick="openAchievements()" data-i18n="achievements">ДОСТИЖЕНИЯ</button>
  </div>
  <button class="btn2" onclick="openDaily()" data-i18n="daily">ЕЖЕДНЕВНАЯ НАГРАДА</button>
  <button class="btn2" onclick="showRewardedForCoins()"><span data-i18n="freeCoins">+50 МОНЕТ ЗА РЕКЛАМУ</span><small data-i18n="watchAdHint">(посмотреть ролик)</small></button>
  <button class="btn2" onclick="showNameScreen()" style="font-size:12px;padding:6px 16px;" data-i18n="changeName">Сменить ник</button>
</div>

<div id="gameover" class="overlay hidden">
  <h2 data-i18n="gameover">ИГРА ОКОНЧЕНА</h2>
  <p><span data-i18n="platform">Платформа</span>: <span id="finalScore">0</span><br><span data-i18n="coinsCollected">Собрано монет</span>: <span id="finalCoins">0</span></p>
  <button class="btn-ad" id="continueBtn" onclick="continueForAd()"><span data-i18n="continueAd">ПРОДОЛЖИТЬ ЗА РЕКЛАМУ</span><small data-i18n="continueHint">(сохранить прогресс)</small></button>
  <button onclick="restartGame()"><span data-i18n="tryAgain">ЕЩЁ РАЗ</span><small data-i18n="restartHint">(с нуля)</small></button>
  <button class="btn2" onclick="goMenu()" data-i18n="menu">В МЕНЮ</button>
</div>

<div id="shop" class="overlay hidden">
  <h2 data-i18n="shopTitle">МАГАЗИН</h2>
  <p><span data-i18n="coinsLabel">Монеты</span>: <span id="shopCoins">0</span></p>
  <div class="shop-tabs">
    <button id="tabSkins" class="active" onclick="switchTab('skins')" data-i18n="tabSkins">СКИНЫ</button>
    <button id="tabBackgrounds" onclick="switchTab('backgrounds')" data-i18n="tabBg">ФОНЫ</button>
    <button id="tabAbilities" onclick="switchTab('abilities')" data-i18n="tabAbilities">СПОСОБНОСТИ</button>
  </div>
  <div class="shop-grid" id="shopGrid"></div>
  <button class="btn2" onclick="closeShop()" style="margin-top:14px;" data-i18n="back">НАЗАД</button>
</div>

<div id="leaderboard" class="overlay hidden">
  <h2 data-i18n="leadersTitle">ТАБЛИЦА ЛИДЕРОВ</h2>
  <div id="leaderboardList" style="width:100%;max-width:400px;max-height:60vh;overflow-y:auto;"></div>
  <button class="btn2" onclick="closeLeaderboard()" style="margin-top:14px;" data-i18n="back">НАЗАД</button>
</div>

<div id="achievements" class="overlay hidden">
  <h2 data-i18n="achTitle">ДОСТИЖЕНИЯ</h2>
  <div class="shop-grid" id="achGrid" style="max-height:60vh;"></div>
  <button class="btn2" onclick="closeAchievements()" style="margin-top:14px;" data-i18n="back">НАЗАД</button>
</div>

<div id="daily" class="overlay hidden">
  <h2 data-i18n="dailyTitle">ЕЖЕДНЕВНАЯ НАГРАДА</h2>
  <p id="dailyStatus"></p>
  <div id="dailyTasks" style="width:100%;max-width:400px;"></div>
  <button class="btn2" onclick="closeDaily()" style="margin-top:14px;" data-i18n="back">НАЗАД</button>
</div>

<script>
const TRANSLATIONS = {
  ru: {
    level:'Уровень', platform:'Платформа', height:'Высота', menuDesc:'Прыгай по платформам как можно выше!',
    play:'ИГРАТЬ', shop:'МАГАЗИН', leaders:'ЛИДЕРЫ', achievements:'ДОСТИЖЕНИЯ', daily:'ЕЖЕДНЕВНАЯ НАГРАДА',
    freeCoins:'+50 МОНЕТ ЗА РЕКЛАМУ', watchAdHint:'(посмотреть ролик)', gameover:'ИГРА ОКОНЧЕНА',
    coinsCollected:'Собрано монет', continueAd:'ПРОДОЛЖИТЬ ЗА РЕКЛАМУ', continueHint:'(сохранить прогресс)',
    tryAgain:'ЕЩЁ РАЗ', restartHint:'(с нуля)', menu:'В МЕНЮ', shopTitle:'МАГАЗИН', coinsLabel:'Монеты',
    back:'НАЗАД', selected:'ВЫБРАН', choose:'ВЫБРАТЬ', buy:'КУПИТЬ', tabSkins:'СКИНЫ', tabBg:'ФОНЫ', tabAbilities:'СПОСОБНОСТИ',
    notEnough:'Недостаточно монет!', adFail:'Реклама недоступна', loading:'Загрузка...', continueUsed:'Продолжение уже использовано',
    descMagnet:'Притягивает монеты', descDoubleJump:'Второй прыжок в воздухе', descSecondChance:'Возрождение 1 раз за раунд',
    enterName:'ВВЕДИТЕ НИК', nameHint:'Он будет отображаться в таблице рекордов', save:'СОХРАНИТЬ', yourRecord:'Твой рекорд',
    platforms:'платформ', nameTooShort:'Ник должен быть не короче 2 символов', changeName:'Сменить ник',
    leadersTitle:'ТАБЛИЦА ЛИДЕРОВ', achTitle:'ДОСТИЖЕНИЯ', dailyTitle:'ЕЖЕДНЕВНАЯ НАГРАДА',
    dailyAlready:'Ты уже получил награду сегодня. Заходи завтра!', dailyGot:'+100 монет! Возвращайся завтра!',
    dailyClaim:'ЗАБРАТЬ +100 МОНЕТ', dailyTasksTitle:'ЕЖЕДНЕВНЫЕ ЗАДАНИЯ', taskDone:'ВЫПОЛНЕНО',
    noLeaderboard:'Таблица лидеров доступна после публикации', leaderboardLoading:'Загрузка...'
  },
  en: {
    level:'Level', platform:'Platform', height:'Height', menuDesc:'Jump across platforms as high as you can!',
    play:'PLAY', shop:'SHOP', leaders:'LEADERS', achievements:'ACHIEVEMENTS', daily:'DAILY REWARD',
    freeCoins:'+50 COINS FOR AD', watchAdHint:'(watch ad)', gameover:'GAME OVER',
    coinsCollected:'Coins collected', continueAd:'CONTINUE FOR AD', continueHint:'(keep progress)',
    tryAgain:'TRY AGAIN', restartHint:'(from scratch)', menu:'MENU', shopTitle:'SHOP', coinsLabel:'Coins',
    back:'BACK', selected:'SELECTED', choose:'SELECT', buy:'BUY', tabSkins:'SKINS', tabBg:'BACKGROUNDS', tabAbilities:'ABILITIES',
    notEnough:'Not enough coins!', adFail:'Ad not available', loading:'Loading...', continueUsed:'Continue already used',
    descMagnet:'Attracts coins', descDoubleJump:'Double jump in air', descSecondChance:'Revive once per run',
    enterName:'ENTER YOUR NICKNAME', nameHint:'It will be shown on the leaderboard', save:'SAVE', yourRecord:'Your record',
    platforms:'platforms', nameTooShort:'Name must be at least 2 characters', changeName:'Change nickname',
    leadersTitle:'LEADERBOARD', achTitle:'ACHIEVEMENTS', dailyTitle:'DAILY REWARD',
    dailyAlready:'You already claimed today. Come back tomorrow!', dailyGot:'+100 coins! Come back tomorrow!',
    dailyClaim:'CLAIM +100 COINS', dailyTasksTitle:'DAILY TASKS', taskDone:'DONE',
    noLeaderboard:'Leaderboard available after publication', leaderboardLoading:'Loading...'
  }
};
let LANG = 'ru';
function t(key) { return TRANSLATIONS[LANG][key] || TRANSLATIONS.ru[key] || key; }
function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
  const l = document.getElementById('loading'); if (l) l.textContent = t('loading');
}
applyI18n();

const AD_INTERSTITIAL_EVERY = 3;
const PLATFORM_STEP_Y_MIN = 110;
const PLATFORM_STEP_Y_MAX = 150;
const PLATFORM_STEP_X_MAX = 160;
const COMBO_WINDOW = 2000;

let ysdk = null, sdkReady = false, playerData = null, leaderboard = null;

let player = {
  coins:0, totalScore:0, selectedSkin:0, ownedSkins:[0], runs:0,
  selectedBg:0, ownedBgs:[0],
  abilities:{ magnet:false, doubleJump:false, secondChance:false },
  name:'', achievements:{}, dailyLast:'',
  dailyTasks:{ date:'', coins:0, platforms:0, claimed:{} },
  settings:{ adsEvery: AD_INTERSTITIAL_EVERY }
};

async function initSDK() {
  try {
    ysdk = await YaGames.init();
    sdkReady = true;
    const lang = ysdk.environment.i18n.lang;
    LANG = (lang && lang.startsWith('ru')) ? 'ru' : 'en';
    applyI18n();
    try {
      playerData = await ysdk.getPlayer({ scopes: false });
      const cloudSave = await playerData.getData(['save']);
      if (cloudSave && cloudSave.save) player = Object.assign(player, cloudSave.save);
      else { try { const local = localStorage.getItem('neonjump_save'); if (local) player = JSON.parse(local); } catch(e){} }
    } catch(e) { console.warn('Cloud save load failed', e); }
    try { leaderboard = await ysdk.getLeaderboards(); } catch(e) { console.warn('Leaderboard init failed', e); }
    document.getElementById('loading').classList.add('hidden');
    if (!player.name) showNameScreen();
    else { document.getElementById('menu').classList.remove('hidden'); updateMenuInfo(); }
  } catch (e) {
    console.warn('SDK init failed, fallback', e);
    try { const local = localStorage.getItem('neonjump_save'); if (local) player = JSON.parse(local); } catch(e){}
    document.getElementById('loading').classList.add('hidden');
    if (!player.name) showNameScreen();
    else { document.getElementById('menu').classList.remove('hidden'); updateMenuInfo(); }
  }
}
initSDK();

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

function save() {
  try { localStorage.setItem('neonjump_save', JSON.stringify(player)); } catch(e){}
  if (sdkReady && playerData) playerData.setData({ save: player }).catch(e => console.warn('Cloud save failed', e));
}

const SKINS = [
  { name:'Neon', color:'#0ff', glow:'#0ff', price:0 },
  { name:'Magenta', color:'#f0f', glow:'#f0f', price:50 },
  { name:'Lime', color:'#0f0', glow:'#0f0', price:100 },
  { name:'Gold', color:'#ff0', glow:'#ff0', price:200 },
  { name:'Fire', color:'#f60', glow:'#f60', price:350 },
  { name:'Ice', color:'#8cf', glow:'#8cf', price:500 }
];
const BACKGROUNDS = [
  { name:'Космос', nameEn:'Space', colors:['#0a0a20','#1a0a2e'], star:'#ffffff', price:0 },
  { name:'Закат', nameEn:'Sunset', colors:['#2a0a20','#4a1a10'], star:'#ffaa55', price:100 },
  { name:'Матрица', nameEn:'Matrix', colors:['#001a00','#002200'], star:'#00ff44', price:200 },
  { name:'Лава', nameEn:'Lava', colors:['#1a0000','#3a0a00'], star:'#ff4400', price:300 }
];
const ABILITIES = [
  { key:'magnet', price:150, nameRu:'Магнит', nameEn:'Magnet' },
  { key:'doubleJump', price:250, nameRu:'Двойной прыжок', nameEn:'Double Jump' },
  { key:'secondChance', price:400, nameRu:'Второй шанс', nameEn:'Second Chance' }
];
const ACHIEVEMENTS = [
  { key:'plat_1', ru:'Первый шаг', en:'First step', descRu:'Встань на 1-ю платформу', descEn:'Reach platform 1', check:(s,p)=>p.totalScore>=1 },
  { key:'plat_10', ru:'Новичок', en:'Rookie', descRu:'Дойди до 10 платформ', descEn:'Reach platform 10', check:(s,p)=>p.totalScore>=10 },
  { key:'plat_25', ru:'Опытный', en:'Experienced', descRu:'Дойди до 25 платформ', descEn:'Reach platform 25', check:(s,p)=>p.totalScore>=25 },
  { key:'plat_50', ru:'Мастер', en:'Master', descRu:'Дойди до 50 платформ', descEn:'Reach platform 50', check:(s,p)=>p.totalScore>=50 },
  { key:'plat_100', ru:'Легенда', en:'Legend', descRu:'Дойди до 100 платформ', descEn:'Reach platform 100', check:(s,p)=>p.totalScore>=100 },
  { key:'coins_100', ru:'Копилка', en:'Piggy bank', descRu:'Собери 100 монет', descEn:'Collect 100 coins', check:(s,p)=>p.coins>=100 },
  { key:'coins_500', ru:'Богач', en:'Rich', descRu:'Собери 500 монет', descEn:'Collect 500 coins', check:(s,p)=>p.coins>=500 },
  { key:'coins_1000', ru:'Миллионер', en:'Millionaire', descRu:'Собери 1000 монет', descEn:'Collect 1000 coins', check:(s,p)=>p.coins>=1000 },
  { key:'skin_3', ru:'Модник', en:'Fashionista', descRu:'Купи 3 скина', descEn:'Buy 3 skins', check:(s,p)=>p.ownedSkins.length>=3 },
  { key:'skin_all', ru:'Коллекционер', en:'Collector', descRu:'Купи все скины', descEn:'Buy all skins', check:(s,p)=>p.ownedSkins.length>=SKINS.length },
  { key:'bg_2', ru:'Путешественник', en:'Traveler', descRu:'Купи 2 фона', descEn:'Buy 2 backgrounds', check:(s,p)=>p.ownedBgs.length>=2 },
  { key:'runs_10', ru:'Настойчивый', en:'Persistent', descRu:'Сыграй 10 раундов', descEn:'Play 10 runs', check:(s,p)=>p.runs>=10 }
];

let state = 'menu';
let camera = 0, platforms = [], coinsArr = [], particles = [], enemies = [];
let playerObj = { x:0, y:0, vx:0, vy:0, w:40, h:40, jumpsLeft:1 };
let score = 0, runCoins = 0, level = 1, maxHeight = 0, platformCount = 0;
let keys = { left:false, right:false };
let continueUsedThisRun = false, secondChanceUsed = false;
let menuAnimT = 0, currentShopTab = 'skins';
let gameTime = 0, lastFrameTime = performance.now(), deltaTime = 0;
let comboCount = 0, lastCoinTime = 0;
let shieldActive = false, slowActive = false, slowTimer = 0;

function getJumpsMax() { return player.abilities.doubleJump ? 2 : 1; }
function initLevel() {
  platforms = []; coinsArr = []; particles = []; enemies = [];
  camera = 0; score = 0; runCoins = 0; maxHeight = 0; platformCount = 0;
  level = 1;
  continueUsedThisRun = false; secondChanceUsed = false;
  comboCount = 0; lastCoinTime = 0;
  shieldActive = false; slowActive = false; slowTimer = 0;
  document.getElementById('continueBtn').style.display = 'block';

  platforms.push({ x: W/2 - 60, y: H - 120, w:120, h:20, type:'normal', visited:true, bonus:null });
  platformCount = 1;
  let y = H - 120, lastX = W/2 - 60;

  for (let i = 0; i < 50; i++) {
    y -= PLATFORM_STEP_Y_MIN + Math.random() * (PLATFORM_STEP_Y_MAX - PLATFORM_STEP_Y_MIN);
    let x = lastX + (Math.random()*2 - 1) * PLATFORM_STEP_X_MAX;
    x = Math.max(10, Math.min(W - 120, x));
    lastX = x;
    const r = Math.random();
    const type = r < 0.1 ? 'moving' : (r < 0.25 ? 'fragile' : 'normal');
    const plat = { x, y, w:110, h:18, type, baseX:x, phase:Math.random()*Math.PI*2, visited:false, bonus:null };
    if (type === 'normal' && Math.random() < 0.1) {
      const bonuses = ['shield', 'rocket', 'slow'];
      plat.bonus = bonuses[Math.floor(Math.random()*bonuses.length)];
    }
    platforms.push(plat);
    if (Math.random() < 0.5) coinsArr.push({ x:x+55, y:y-35, r:12, collected:false, phase:Math.random()*6, value:1 });
    if (i > 2 && Math.random() < 0.15 && type === 'normal' && !plat.bonus) {
      enemies.push({ x:x+40, y:y-24, r:14, baseX:x+40, phase:Math.random()*6, dead:false });
    }
  }

  playerObj = { x:W/2 - 20, y:H - 160, vx:0, vy:0, w:40, h:40, jumpsLeft: getJumpsMax() };
  state = 'playing';
  document.getElementById('hud').classList.remove('hidden');
  updateHearts();
  updateHUD();
}

function updateHearts() {
  const el = document.getElementById('hearts');
  if (!player.abilities.secondChance) { el.textContent = ''; return; }
  el.textContent = secondChanceUsed ? '💔' : '❤️';
}

function updateHUD() {
  document.getElementById('scoreNum').textContent = platformCount;
  document.getElementById('levelNum').textContent = level;
  document.getElementById('coins').textContent = '🪙 ' + (player.coins + runCoins);
  const comboEl = document.getElementById('comboDisplay');
  if (comboCount >= 2) comboEl.textContent = 'x' + comboCount;
  else comboEl.textContent = '';
}

function spawnNewPlatforms() {
  let safety = 0;
  while (safety < 50) {
    safety++;
    const topPlatform = platforms.reduce((a,b) => a.y < b.y ? a : b);
    if (topPlatform.y < playerObj.y - 800) break;
    let topY = topPlatform.y;
    let lastX = topPlatform.x;
    for (let i = 0; i < 10; i++) {
      topY -= PLATFORM_STEP_Y_MIN + Math.random() * (PLATFORM_STEP_Y_MAX - PLATFORM_STEP_Y_MIN);
      let x = lastX + (Math.random()*2 - 1) * PLATFORM_STEP_X_MAX;
      x = Math.max(10, Math.min(W - 120, x));
      lastX = x;
      const r = Math.random();
      const type = r < 0.1 ? 'moving' : (r < 0.25 ? 'fragile' : 'normal');
      const plat = { x, y:topY, w:110, h:18, type, baseX:x, phase:Math.random()*Math.PI*2, visited:false, bonus:null };
      if (type === 'normal' && Math.random() < 0.1) {
        const bonuses = ['shield', 'rocket', 'slow'];
        plat.bonus = bonuses[Math.floor(Math.random()*bonuses.length)];
      }
      platforms.push(plat);
      if (Math.random() < 0.5) coinsArr.push({ x:x+55, y:topY-35, r:12, collected:false, phase:Math.random()*6, value:1 });
      if (Math.random() < 0.2 && type === 'normal' && !plat.bonus) enemies.push({ x:x+40, y:topY-24, r:14, baseX:x+40, phase:Math.random()*6, dead:false });
    }
  }
  platforms = platforms.filter(p => p.y < H + 300);
  coinsArr = coinsArr.filter(c => c.y < H + 300);
  enemies = enemies.filter(e => e.y < H + 300 && !e.dead);
}

function update() {
  if (state !== 'playing') { menuAnimT += 0.02; return; }

  if (slowActive) {
    slowTimer -= deltaTime;
    if (slowTimer <= 0) slowActive = false;
  }
  const timeScale = slowActive ? 0.5 : 1;

  let move = 0;
  if (keys.left) move -= 1;
  if (keys.right) move += 1;
  playerObj.vx += move * 1.8 * timeScale;
  playerObj.vx *= 0.92;
  playerObj.vx = Math.max(-8, Math.min(8, playerObj.vx));
  if (Math.abs(playerObj.vx) < 0.1) playerObj.vx = 0;
  playerObj.vy += 0.55 * timeScale;

  for (const p of platforms) {
    if (p.type === 'moving') p.x = p.baseX + Math.sin(gameTime + p.phase) * 60;
  }

  if (playerObj.vy > 0) {
    for (const p of platforms) {
      if (playerObj.x + playerObj.w > p.x && playerObj.x < p.x + p.w &&
          playerObj.y + playerObj.h > p.y && playerObj.y + playerObj.h < p.y + p.h + 20) {
        playerObj.y = p.y - playerObj.h;
        playerObj.vy = -14 * timeScale;
        playerObj.jumpsLeft = getJumpsMax();
        if (p.type === 'fragile' && !p.broken) { p.broken = true; p.fade = 1; }
        if (!p.visited) {
          p.visited = true;
          platformCount++;
          score = platformCount;
          maxHeight = Math.max(maxHeight, platformCount);
          const newLevel = Math.floor(platformCount / 25) + 1;
          if (newLevel > level) {
            level = newLevel;
            const bgIndex = Math.min((level - 1) % BACKGROUNDS.length, BACKGROUNDS.length - 1);
            player.selectedBg = bgIndex;
          }
          if (player.dailyTasks && player.dailyTasks.date === todayStr()) {
            player.dailyTasks.platforms = Math.max(player.dailyTasks.platforms || 0, platformCount);
          }
        }
        if (p.bonus) { activateBonus(p.bonus); p.bonus = null; }
        break;
      }
    }
  }

  platforms = platforms.filter(p => { if (p.broken) { p.fade -= 0.05; return p.fade > 0; } return true; });

  for (const e of enemies) {
    if (e.dead) continue;
    e.x = e.baseX + Math.sin(gameTime * 1.25 + e.phase) * 25;
    if (Math.abs(e.x - (playerObj.x + 20)) < 28 && Math.abs(e.y - (playerObj.y + 20)) < 28) {
      if (shieldActive) { shieldActive = false; e.dead = true; toast('🛡️'); }
      else { killPlayer(); return; }
    }
  }

  playerObj.x += playerObj.vx;
  playerObj.y += playerObj.vy;
  if (playerObj.x < 0) { playerObj.x = 0; playerObj.vx = 0; }
  if (playerObj.x + playerObj.w > W) { playerObj.x = W - playerObj.w; playerObj.vx = 0; }

  if (playerObj.y < H * 0.4) {
    const diff = H * 0.4 - playerObj.y;
    playerObj.y = H * 0.4;
    camera += diff;
    for (const p of platforms) p.y += diff;
    for (const c of coinsArr) c.y += diff;
    for (const e of enemies) e.y += diff;
  }

  const magnetR = player.abilities.magnet ? 120 : 0;
  for (const c of coinsArr) {
    if (c.collected) continue;
    const dx = (playerObj.x + 20) - c.x, dy = (playerObj.y + 20) - c.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (magnetR > 0 && dist < magnetR && dist > 1) {
      c.x += (dx / dist) * 6 * timeScale;
      c.y += (dy / dist) * 6 * timeScale;
    }
    if (Math.abs(c.x - (playerObj.x + 20)) < 30 && Math.abs(c.y - (playerObj.y + 20)) < 30) {
      c.collected = true;
      const now = performance.now();
      if (now - lastCoinTime < COMBO_WINDOW) comboCount++;
      else comboCount = 1;
      lastCoinTime = now;
      const mult = comboCount >= 5 ? 3 : (comboCount >= 3 ? 2 : 1);
      runCoins += c.value * mult;
      spawnParticles(c.x, c.y, '#ff0');
      if (player.dailyTasks && player.dailyTasks.date === todayStr()) {
        player.dailyTasks.coins = (player.dailyTasks.coins || 0) + c.value * mult;
      }
    }
  }

  for (const pt of particles) { pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.2; pt.life -= 0.02; }
  particles = particles.filter(pt => pt.life > 0);

  spawnNewPlatforms();

  if (playerObj.y > H + 100) killPlayer();

  updateHUD();
}

function activateBonus(type) {
  if (type === 'shield') { shieldActive = true; toast('🛡️'); }
  else if (type === 'rocket') { playerObj.vy = -22; toast('🚀'); }
  else if (type === 'slow') { slowActive = true; slowTimer = 5; toast('⏳'); }
}

function killPlayer() {
  if (player.abilities.secondChance && !secondChanceUsed) {
    secondChanceUsed = true;
    if (platforms.length > 0) {
      const lowest = platforms.reduce((a,b) => a.y > b.y ? a : b);
      playerObj.y = lowest.y - 40;
      playerObj.x = Math.max(0, Math.min(W - playerObj.w, lowest.x + lowest.w/2 - playerObj.w/2));
      playerObj.vy = -14; playerObj.jumpsLeft = getJumpsMax();
      updateHearts();
      spawnParticles(playerObj.x + 20, playerObj.y + 20, '#0f0');
      return;
    }
  }
  endGame();
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1800);
}
function draw() {
  const bg = BACKGROUNDS[player.selectedBg] || BACKGROUNDS[0];
  const grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, bg.colors[0]); grd.addColorStop(1, bg.colors[1]);
  ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = bg.star; ctx.globalAlpha = 0.4;
  for (let i = 0; i < 60; i++) {
    const sx = (i*137.5)%W;
    const sy = (i*91.7 + camera*0.1 + (state==='menu'?menuAnimT*30:0))%H;
    ctx.fillRect(sx, sy, (i%3===0)?3:2, (i%3===0)?3:2);
  }
  ctx.globalAlpha = 1;

  if (state === 'menu') {
    const cx = W/2, cy = H/2 + 100 + Math.sin(menuAnimT*2)*15;
    const skin = SKINS[player.selectedSkin];
    ctx.shadowColor = skin.glow; ctx.shadowBlur = 25; ctx.fillStyle = skin.color;
    ctx.fillRect(cx-20, cy-20, 40, 40);
    ctx.shadowBlur = 0;
    return;
  }
  if (state !== 'playing' && state !== 'gameover') return;

  for (const p of platforms) {
    ctx.globalAlpha = p.broken ? p.fade : 1;
    if (p.type === 'fragile') {
      ctx.strokeStyle = '#f66'; ctx.lineWidth = 3; ctx.shadowColor = '#f66'; ctx.shadowBlur = 15;
      ctx.strokeRect(p.x, p.y, p.w, p.h);
    } else if (p.type === 'moving') {
      ctx.fillStyle = '#f0f'; ctx.shadowColor = '#f0f'; ctx.shadowBlur = 15;
      ctx.fillRect(p.x, p.y, p.w, p.h);
    } else {
      ctx.fillStyle = '#0ff'; ctx.shadowColor = '#0ff'; ctx.shadowBlur = 15;
      ctx.fillRect(p.x, p.y, p.w, p.h);
    }
    if (p.bonus) {
      ctx.font = '20px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(p.bonus === 'shield' ? '🛡️' : (p.bonus === 'rocket' ? '🚀' : '⏳'), p.x + p.w/2, p.y - 18);
    }
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }

  for (const c of coinsArr) {
    if (c.collected) continue;
    c.phase += 0.05;
    const scale = Math.abs(Math.cos(c.phase));
    ctx.save(); ctx.translate(c.x, c.y); ctx.scale(scale, 1);
    ctx.fillStyle = '#ff0'; ctx.shadowColor = '#ff0'; ctx.shadowBlur = 15;
    ctx.beginPath(); ctx.arc(0, 0, c.r, 0, Math.PI*2); ctx.fill(); ctx.restore();
    ctx.shadowBlur = 0;
  }

  for (const e of enemies) {
    if (e.dead) continue;
    ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(Math.PI/4);
    ctx.fillStyle = '#f22'; ctx.shadowColor = '#f22'; ctx.shadowBlur = 20;
    ctx.fillRect(-e.r, -e.r, e.r*2, e.r*2);
    ctx.restore();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(e.x, e.y, 3, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  for (const pt of particles) {
    ctx.globalAlpha = pt.life; ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (shieldActive) {
    ctx.strokeStyle = '#0f0'; ctx.lineWidth = 3; ctx.shadowColor = '#0f0'; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.arc(playerObj.x + 20, playerObj.y + 20, 34, 0, Math.PI*2); ctx.stroke();
    ctx.shadowBlur = 0;
  }

  const skin = SKINS[player.selectedSkin];
  ctx.shadowColor = skin.glow; ctx.shadowBlur = 25; ctx.fillStyle = skin.color;
  const px = playerObj.x, py = playerObj.y, pw = playerObj.w, ph = playerObj.h, r = 8;
  ctx.beginPath();
  ctx.moveTo(px+r, py); ctx.lineTo(px+pw-r, py);
  ctx.quadraticCurveTo(px+pw, py, px+pw, py+r);
  ctx.lineTo(px+pw, py+ph-r); ctx.quadraticCurveTo(px+pw, py+ph, px+pw-r, py+ph);
  ctx.lineTo(px+r, py+ph); ctx.quadraticCurveTo(px, py+ph, px, py+ph-r);
  ctx.lineTo(px, py+r); ctx.quadraticCurveTo(px, py, px+r, py);
  ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(px+13, py+15, 3, 0, Math.PI*2); ctx.arc(px+27, py+15, 3, 0, Math.PI*2); ctx.fill();
}

function spawnParticles(x, y, color) {
  for (let i = 0; i < 8; i++) {
    particles.push({ x, y, vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6-2, r:Math.random()*4+2, color, life:1 });
  }
}

function loop() {
  const now = performance.now();
  deltaTime = Math.min((now - lastFrameTime) / 1000, 0.05);
  lastFrameTime = now;
  gameTime += deltaTime;
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
  if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') && state === 'playing' && playerObj.jumpsLeft > 1) {
    playerObj.vy = -13; playerObj.jumpsLeft--; spawnParticles(playerObj.x + 20, playerObj.y + 40, '#0ff');
  }
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
});
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const tx = e.touches[0].clientX, ty = e.touches[0].clientY;
  if (state === 'playing') {
    if (ty < H/2) {
      if (playerObj.jumpsLeft > 1) { playerObj.vy = -13; playerObj.jumpsLeft--; spawnParticles(playerObj.x + 20, playerObj.y + 40, '#0ff'); }
    } else {
      if (tx < W/2) keys.left = true; else keys.right = true;
    }
  }
}, { passive:false });
canvas.addEventListener('touchend', e => { e.preventDefault(); keys.left = false; keys.right = false; }, { passive:false });
canvas.addEventListener('mousedown', e => {
  if (state === 'playing') {
    if (e.clientY < H/2) {
      if (playerObj.jumpsLeft > 1) { playerObj.vy = -13; playerObj.jumpsLeft--; spawnParticles(playerObj.x + 20, playerObj.y + 40, '#0ff'); }
    } else {
      if (e.clientX < W/2) keys.left = true; else keys.right = true;
    }
  }
});
canvas.addEventListener('mouseup', () => { keys.left = false; keys.right = false; });

async function loadLeaderboard() {
  const list = document.getElementById('leaderboardList');
  list.innerHTML = '<p style="color:#0ff;">' + t('leaderboardLoading') + '</p>';
  if (!sdkReady || !leaderboard) {
    list.innerHTML = '<p style="color:#889;">' + t('noLeaderboard') + '</p>';
    return;
  }
  try {
    const res = await leaderboard.getLeaderboardEntries('height', { quantityTop: 20, includeUser: true, quantityAround: 3 });
    list.innerHTML = '';
    if (!res.entries || res.entries.length === 0) {
      list.innerHTML = '<p style="color:#889;">' + t('noLeaderboard') + '</p>';
      return;
    }
    res.entries.forEach((entry, i) => {
      const div = document.createElement('div');
      const isMe = entry.player && entry.player.uniqueID === (playerData ? playerData.uniqueID : '');
      div.style.cssText = 'display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #333;' + (isMe ? 'background:#1a1a2e;' : '');
      div.innerHTML = '<span style="color:' + (i < 3 ? '#ff0' : '#fff') + ';">#' + entry.rank + ' ' + (entry.player.publicName || 'Player') + '</span><span style="color:#0ff;">' + entry.score + '</span>';
      list.appendChild(div);
    });
  } catch(e) {
    console.warn('Leaderboard load failed', e);
    list.innerHTML = '<p style="color:#889;">' + t('noLeaderboard') + '</p>';
  }
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}

function renderDaily() {
  const status = document.getElementById('dailyStatus');
  const tasks = document.getElementById('dailyTasks');
  const today = todayStr();
  const canClaim = player.dailyLast !== today;
  status.innerHTML = canClaim
    ? '<button onclick="claimDaily()">' + t('dailyClaim') + '</button>'
    : '<span style="color:#0f0;">' + t('dailyAlready') + '</span>';
  tasks.innerHTML = '<p style="color:#f0f;font-size:15px;margin:12px 0 8px;">' + t('dailyTasksTitle') + '</p>';
  if (!player.dailyTasks || player.dailyTasks.date !== today) {
    player.dailyTasks = { date: today, coins: 0, platforms: 0, claimed: {} };
    save();
  }
  const dt = player.dailyTasks;
  const taskDefs = [
    { key:'coins50', ru:'Собери 50 монет', en:'Collect 50 coins', done: dt.coins >= 50, reward: 30 },
    { key:'plat10', ru:'Дойди до 10 платформ', en:'Reach platform 10', done: dt.platforms >= 10, reward: 20 },
    { key:'plat20', ru:'Дойди до 20 платформ', en:'Reach platform 20', done: dt.platforms >= 20, reward: 40 }
  ];
  taskDefs.forEach(td => {
    const claimed = dt.claimed && dt.claimed[td.key];
    const div = document.createElement('div');
    div.style.cssText = 'background:#1a1a2e;border:2px solid #333;border-radius:10px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;';
    if (td.done && !claimed) div.style.borderColor = '#0f0';
    const label = LANG === 'ru' ? td.ru : td.en;
    div.innerHTML = '<span style="font-size:13px;color:#fff;">' + label + '</span>' +
      (claimed ? '<span style="color:#0f0;font-size:12px;">✓</span>'
        : td.done ? '<button onclick="claimTask(\'' + td.key + '\',' + td.reward + ')" style="padding:6px 14px;font-size:12px;margin:0;">' + td.reward + ' 🪙</button>'
        : '<span style="color:#889;font-size:12px;">' + Math.min(100, Math.floor((td.key === 'coins50' ? dt.coins/50 : (td.key === 'plat10' ? dt.platforms/10 : dt.platforms/20))*100)) + '%</span>');
    tasks.appendChild(div);
  });
}

  const today = todayStr();
  if (player.dailyLast === today) { alert(t('dailyAlready')); return; }
  player.dailyLast = today;

function endGame() {
  state = 'gameover';
  player.coins += runCoins;
  player.totalScore = Math.max(player.totalScore, maxHeight);
  player.runs = (player.runs || 0) + 1;
  checkAchievements();
  save();
  submitScore(maxHeight);
  document.getElementById('finalScore').textContent = maxHeight;
  document.getElementById('finalCoins').textContent = runCoins;
  document.getElementById('gameover').classList.remove('hidden');
  document.getElementById('hud').classList.add('hidden');
  updateMenuInfo();
  const adsEvery = player.settings && player.settings.adsEvery ? player.settings.adsEvery : AD_INTERSTITIAL_EVERY;
  if (player.runs % adsEvery === 0) showInterstitial();
}

function restartGame() { startGame(); }

function goMenu() {
  state = 'menu';
  document.getElementById('gameover').classList.add('hidden');
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('menu').classList.remove('hidden');
  updateMenuInfo();
}

function openShop() {
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('gameover').classList.add('hidden');
  document.getElementById('shop').classList.remove('hidden');
  renderShop();
}

function closeShop() {
  document.getElementById('shop').classList.add('hidden');
  if (state === 'gameover') document.getElementById('gameover').classList.remove('hidden');
  else { document.getElementById('menu').classList.remove('hidden'); updateMenuInfo(); }
}

function updateShopCoins() {
  const el = document.getElementById('shopCoins');
  if (el) el.textContent = player.coins;
  const c = document.getElementById('coins');
  if (c) c.textContent = '🪙 ' + (player.coins + (state === 'playing' ? runCoins : 0));
}

function switchTab(tab) {
  currentShopTab = tab;
  document.getElementById('tabSkins').classList.toggle('active', tab === 'skins');
  document.getElementById('tabBackgrounds').classList.toggle('active', tab === 'backgrounds');
  document.getElementById('tabAbilities').classList.toggle('active', tab === 'abilities');
  renderShop();
}

function renderShop() {
  updateShopCoins();
  const grid = document.getElementById('shopGrid');
  grid.innerHTML = '';
  if (currentShopTab === 'skins') {
    SKINS.forEach((skin, i) => {
      const owned = player.ownedSkins.includes(i);
      const selected = player.selectedSkin === i;
      const div = document.createElement('div');
      div.className = 'shop-item' + (owned ? ' owned' : '') + (selected ? ' selected' : '');
      div.innerHTML = '<div class="dot" style="background:' + skin.color + ';color:' + skin.glow + '"></div><div class="name">' + skin.name + '</div>' +
        (owned ? (selected ? '<button class="btn2" disabled>' + t('selected') + '</button>' : '<button onclick="selectSkin(' + i + ')">' + t('choose') + '</button>')
               : '<button onclick="buySkin(' + i + ')">' + skin.price + ' 🪙</button>');
      grid.appendChild(div);
    });
  } else if (currentShopTab === 'backgrounds') {
    BACKGROUNDS.forEach((bg, i) => {
      const owned = player.ownedBgs.includes(i);
      const selected = player.selectedBg === i;
      const name = LANG === 'ru' ? bg.name : bg.nameEn;
      const div = document.createElement('div');
      div.className = 'shop-item' + (owned ? ' owned' : '') + (selected ? ' selected' : '');
      div.innerHTML = '<div class="preview" style="background:linear-gradient(135deg,' + bg.colors[0] + ',' + bg.colors[1] + ')"></div><div class="name">' + name + '</div>' +
        (owned ? (selected ? '<button class="btn2" disabled>' + t('selected') + '</button>' : '<button onclick="selectBg(' + i + ')">' + t('choose') + '</button>')
               : '<button onclick="buyBg(' + i + ')">' + bg.price + ' 🪙</button>');
      grid.appendChild(div);
    });
  } else if (currentShopTab === 'abilities') {
    ABILITIES.forEach((ab) => {
      const owned = player.abilities[ab.key];
      const name = LANG === 'ru' ? ab.nameRu : ab.nameEn;
      const desc = ab.key === 'magnet' ? t('descMagnet') : (ab.key === 'doubleJump' ? t('descDoubleJump') : t('descSecondChance'));
      const div = document.createElement('div');
      div.className = 'shop-item' + (owned ? ' owned' : '');
      div.innerHTML = '<div class="name">' + name + '</div><div class="desc">' + desc + '</div>' +
        (owned ? '<button class="btn2" disabled>' + t('selected') + '</button>' : '<button onclick="buyAbility(\'' + ab.key + '\',' + ab.price + ')">' + ab.price + ' 🪙</button>');
      grid.appendChild(div);
    });
  }
}

function buySkin(i) {
  const skin = SKINS[i];
  if (player.coins >= skin.price && !player.ownedSkins.includes(i)) {
    player.coins -= skin.price; player.ownedSkins.push(i); player.selectedSkin = i;
    save(); renderShop(); checkAchievements();
  } else if (player.coins < skin.price) alert(t('notEnough'));
}
function selectSkin(i) { player.selectedSkin = i; save(); renderShop(); }

function buyBg(i) {
  const bg = BACKGROUNDS[i];
  if (player.coins >= bg.price && !player.ownedBgs.includes(i)) {
    player.coins -= bg.price; player.ownedBgs.push(i); player.selectedBg = i;
    save(); renderShop(); checkAchievements();
  } else if (player.coins < bg.price) alert(t('notEnough'));
}
function selectBg(i) { player.selectedBg = i; save(); renderShop(); }

function buyAbility(key, price) {
  if (player.coins >= price && !player.abilities[key]) {
    player.coins -= price; player.abilities[key] = true;
    save(); renderShop();
  } else if (player.coins < price) alert(t('notEnough'));
}
</script>
</body>
</html>
